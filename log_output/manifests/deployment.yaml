apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-deployment
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
      containers:
      - name: log-writer
        image: diing54/log-output:v5
        command: ["node", "writer.js"]
        volumeMounts:
        - name: shared-logs
          mountPath: /usr/src/app/files
      - name: log-reader
        image: diing54/log-output:v5
        command: ["node", "reader.js"]
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: shared-logs
          mountPath: /usr/src/app/files
