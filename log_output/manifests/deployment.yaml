apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-deployment
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
        # 1. Define the ConfigMap as a volume
        - name: config-volume
          configMap:
            name: log-output-configmap
      containers:
      - name: log-writer
        image: diing54/log-output:v6
        command: ["node", "writer.js"]
        volumeMounts:
        - name: shared-logs
          mountPath: /usr/src/app/files
      - name: log-reader
        image: diing54/log-output:v6.1
        command: ["node", "reader.js"]
        env:
          - name: MESSAGE
            valueFrom:
              configMapKeyRef:
                name: log-output-configmap
                key: MESSAGE
        ports:
        - containerPort: 3000
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          httpGet:
            path: /healthz
            port: 3000
        volumeMounts:
        - name: shared-logs
          mountPath: /usr/src/app/files
        - name: config-volume
          mountPath: /usr/src/app/config
