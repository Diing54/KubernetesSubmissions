apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-pings
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
      - name: ping-pong
        image: diing54/ping-pong:v2
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: shared-pings
          mountPath: /usr/src/app/shared
