apiVersion: v1
kind: Service
metadata:
  name: ping-pong-db-svc
  namespace: exercises
spec:
  ports:
    - port: 5432
      name: postgres
  clusterIP: None
  selector:
    app: ping-pong-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ping-pong-db-stset
  namespace: exercises
spec:
  serviceName: ping-pong-db-svc
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong-db
  template:
    metadata:
      labels:
        app: ping-pong-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "pingpong"
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 200Mi
